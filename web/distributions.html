(function () {
  "use strict";

  const P = JSON.parse(document.getElementById("payload").textContent);
  const HUE = { 1: "var(--m1)", 2: "var(--m2)", 3: "var(--m3)", 4: "var(--m4)" };
  const SVG = "http://www.w3.org/2000/svg";

  const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const fmt = (v, d) => (v === null || v === undefined || isNaN(v))

  const dec = (m) => (m.unit === "mm" ? 1 : m.unit === "m/s" ? 2 : 1);

  const el = (name, attrs, text) => {

    for (const k in attrs) node.setAttribute(k, attrs[k]);

    return node;

  function niceStep(range, target) {
    if (range <= 0) return 1;
    const raw = range / target;
    const mag = Math.pow(10, Math.floor(Math.log10(raw)));
    const n = raw / mag;
    return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * mag;
  }

  function scaleY(values, zeroBased) {
    const clean = values.filter((v) => v !== null && !isNaN(v));
    if (!clean.length) return { lo: 0, hi: 1, ticks: [0, 1], decimals: 0 };
    const min = Math.min(...clean), max = Math.max(...clean);
    // Snapping to a nice step supplies the padding; adding more on top of it
    // pushes the axis a whole step further out and wastes the plot.
    const rawLo = zeroBased ? 0 : min;
    const rawHi = max || 1;
    let best = null;
    for (const target of [4, 5, 6]) {
      const step = niceStep(rawHi - rawLo || rawHi, target);
      const lo = zeroBased ? 0 : Math.floor(rawLo / step) * step;
      const hi = Math.ceil((rawHi + step * 0.02) / step) * step;
      if (!best || hi - lo < best.hi - best.lo) best = { lo, hi, step };
    }
    const ticks = [];
    for (let t = best.lo; t <= best.hi + best.step * 1e-9; t += best.step) ticks.push(Number(t.toFixed(10)));
    return { lo: best.lo, hi: best.hi, ticks, decimals: Math.min(2, Math.max(0, Math.ceil(-Math.log10(best.step)))) };
  }

  /* Daily rainfall spans three orders of magnitude, so its boxes are unreadable

  function scaleLog(values) {
    const clean = values.filter((v) => v !== null && !isNaN(v) && v > 0);
    if (!clean.length) return { lo: 0.1, hi: 100, ticks: [0.1, 1, 10, 100], log: true, decimals: 1 };
    const lo = Math.pow(10, Math.floor(Math.log10(Math.min(...clean))));
    const hi = Math.pow(10, Math.ceil(Math.log10(Math.max(...clean))));
    const ticks = [];
    for (let e = Math.log10(lo); e <= Math.log10(hi) + 1e-9; e++) ticks.push(Math.pow(10, e));

      const value = Math.max(v, ys.lo);

        x: box.x0 - 8, y: y + 3.5, "text-anchor": "end",
        fill: css("--ink-3"), "font-size": 10, "font-family": css("--mono"),
      }, fmt(t, ys.log && t < 1 ? 1 : ys.log ? 0 : ys.decimals)));
    });
  }

  function attachTip(plot) {
    const tip = document.createElement("div");
    tip.className = "tip";
    plot.appendChild(tip);
    return {
      show(x, y, html) {
        tip.innerHTML = html;
        tip.style.left = x + "px"; tip.style.top = y + "px";
        tip.classList.add("on");
      },
      hide() { tip.classList.remove("on"); },
    };
  }

  /* ------------- 1. box plot by month ------------- */
  function boxplot(plot, m) {
    const w = plot.clientWidth || 700;
    const h = Math.max(260, Math.min(340, w * 0.36));
    const box = { x0: 48, x1: w - 10, y0: 14, y1: h - 26 };
    const hue = css(`--m${m.slot}`);
    const months = m.monthly.filter((b) => b.n > 0);

    const all = [];
    months.forEach((b) => {
      all.push(b.lo_whisker, b.hi_whisker);
      (b.outliers || []).forEach((v) => all.push(v));
    });
    const ys = m.logScale ? scaleLog(all) : scaleY(all, m.key !== "TxSoil0cm");

    plot.querySelectorAll("svg").forEach((n) => n.remove());
    const svg = el("svg", { viewBox: `0 0 ${w} ${h}`, width: w, height: h, role: "img" });
    svg.appendChild(el("title", {}, `${m.en}: daily distribution by month`));

    const slot = (box.x1 - box.x0) / 12;
    const X = (i) => box.x0 + slot * (i + 0.5);
    const Y = project(ys, box);
    const bw = Math.min(34, slot * 0.56);

    grid(svg, box, ys);

    months.forEach((b) => {
      const i = b.month - 1;
      const x = X(i);

      // whiskers
      svg.appendChild(el("line", {
        x1: x, x2: x, y1: Y(b.hi_whisker), y2: Y(b.q3),
        stroke: css("--ink-3"), "stroke-width": 1.2,
      }));
      svg.appendChild(el("line", {
        x1: x, x2: x, y1: Y(b.q1), y2: Y(b.lo_whisker),
        stroke: css("--ink-3"), "stroke-width": 1.2,
      }));
      [b.hi_whisker, b.lo_whisker].forEach((v) => {
        svg.appendChild(el("line", {
          x1: x - bw / 4, x2: x + bw / 4, y1: Y(v), y2: Y(v),
          stroke: css("--ink-3"), "stroke-width": 1.2,
        }));
      });

      // outliers, nudged apart so identical values do not stack invisibly
      (b.outliers || []).forEach((v, k) => {
        const jitter = ((k % 5) - 2) * (bw / 9);
        svg.appendChild(el("circle", {
          cx: x + jitter, cy: Y(v), r: 2.1, fill: hue, opacity: 0.5,
        }));
      });

      // box + median
      const top = Y(b.q3), bottom = Y(b.q1);
      svg.appendChild(el("rect", {
        x: x - bw / 2, y: top, width: bw, height: Math.max(1, bottom - top),
        rx: 2, fill: hue, "fill-opacity": 0.16, stroke: hue, "stroke-width": 1.4,
      }));
      svg.appendChild(el("line", {
        x1: x - bw / 2, x2: x + bw / 2, y1: Y(b.median), y2: Y(b.median),
        stroke: hue, "stroke-width": 2.4, "stroke-linecap": "round",
      }));

      svg.appendChild(el("text", {
        x, y: box.y1 + 15, "text-anchor": "middle",
        fill: css("--ink-3"), "font-size": 10, "font-family": css("--mono"),
      }, b.label[0]));
    });

    const tip = attachTip(plot);
    months.forEach((b) => {
      const i = b.month - 1;
      const hit = el("rect", { x: X(i) - slot / 2, y: box.y0, width: slot, height: box.y1 - box.y0, fill: "transparent" });
      hit.addEventListener("pointerenter", () => {
        const d = dec(m);
        let html = `<b>${b.label}</b> n = ${b.n}<br>` +
          `median ${fmt(b.median, d)} ${m.unit}<br>` +
          `IQR ${fmt(b.q1, d)} – ${fmt(b.q3, d)}<br>` +
          `whiskers ${fmt(b.lo_whisker, d)} – ${fmt(b.hi_whisker, d)}<br>` +
          `outliers ${b.outlier_count}`;
        if (b.dry_pct !== null && b.dry_pct !== undefined) html += `<br>dry days ${fmt(b.dry_pct, 1)}%`;
        tip.show(X(i), Y(b.median), html);
      });
      hit.addEventListener("pointerleave", () => tip.hide());
      svg.appendChild(hit);
    });

    plot.insertBefore(svg, plot.firstChild);
  }

  /* ------------- 2. frequency ------------- */
  function histogram(plot, m) {
    const w = plot.clientWidth || 420;
    const h = Math.max(230, Math.min(290, w * 0.62));
    const box = { x0: 44, x1: w - 10, y0: 16, y1: h - 34 };
    const hue = css(`--m${m.slot}`);
    const bins = m.frequency.bins;
    const ys = scaleY(bins.map((b) => b.count), true);

    plot.querySelectorAll("svg").forEach((n) => n.remove());
    const svg = el("svg", { viewBox: `0 0 ${w} ${h}`, width: w, height: h, role: "img" });
    svg.appendChild(el("title", {}, `${m.en}: frequency of daily values`));

    const slot = (box.x1 - box.x0) / bins.length;
    const X = (i) => box.x0 + slot * (i + 0.5);
    const Y = project(ys, box);
    const bw = Math.max(3, slot - 2);   // 2px surface gap between bars

    grid(svg, box, ys);

    let peak = bins[0];
    bins.forEach((b) => { if (b.count > peak.count) peak = b; });

    bins.forEach((b, i) => {
      const y = Y(b.count);
      svg.appendChild(el("rect", {
        x: X(i) - bw / 2, y, width: bw, height: Math.max(1, box.y1 - y),
        rx: Math.min(4, bw / 2), fill: hue,
      }));
    });

    // Label the modal bin only.
    const pi = bins.indexOf(peak);
    const peakLabel = el("text", {
      x: X(pi), y: Y(peak.count) - 7, "text-anchor": "middle",
      fill: css("--ink"), "font-size": 10.5, "font-weight": 650, "font-family": css("--mono"),
      stroke: css("--surface-ring"), "stroke-width": 3.5, "paint-order": "stroke fill",
    }, `${peak.count.toLocaleString("en-US")} d`);
    svg.appendChild(peakLabel);

    // Skip labels only as far as the widest one actually demands, so narrow
    // viewports stay legible without dropping labels the desktop can fit.
    const widest = bins.reduce((a, b) => Math.max(a, b.label.length), 0) * 5.6;
    const every = Math.max(1, Math.ceil((widest + 6) / slot));
    bins.forEach((b, i) => {
      if (i % every !== 0) return;
      svg.appendChild(el("text", {
        x: X(i), y: box.y1 + 14, "text-anchor": "middle",
        fill: css("--ink-3"), "font-size": 9.5, "font-family": css("--mono"),
      }, b.label));
    });
    svg.appendChild(el("text", {
      x: (box.x0 + box.x1) / 2, y: h - 4, "text-anchor": "middle",
      fill: css("--ink-3"), "font-size": 9.5, "font-family": css("--mono"),
    }, m.frequency.mode === "classes" ? `daily rainfall class (${m.unit})` : `daily value (${m.unit})`));

    const tip = attachTip(plot);
    bins.forEach((b, i) => {
      const hit = el("rect", { x: X(i) - slot / 2, y: box.y0, width: slot, height: box.y1 - box.y0, fill: "transparent" });
      hit.addEventListener("pointerenter", () => {
        const range = m.frequency.mode === "classes"
          ? b.label
          : `${fmt(b.lo, dec(m))} – ${fmt(b.hi, dec(m))} ${m.unit}`;
        tip.show(X(i), Y(b.count), `<b>${range}</b><br>${b.count.toLocaleString("en-US")} days · ${fmt(b.pct, 1)}%`);
      });
      hit.addEventListener("pointerleave", () => tip.hide());
      svg.appendChild(hit);
    });

    plot.insertBefore(svg, plot.firstChild);
  }

  /* ------------- 3. heat map by month ------------- */
  function heatmap(host, m) {
    const heat = m.heatmap;
    const edges = heat.edges;
    const classes = edges.length - 1;
    const d = m.agg === "sum" ? 0 : 1;
    // Cell labels need enough precision to differ from each other: wind spans
    // 0.9-1.6, so rounding to whole numbers would print "1" in every cell.
    const cellDp = heat.max >= 100 ? 0 : heat.max >= 10 ? 1 : 2;

    // One hue, light to dark: each step mixes the measure's hue into the surface.
    const stepColor = (k) =>
      `color-mix(in oklab, var(--hue) ${Math.round(14 + (86 * (k + 1)) / classes)}%, var(--panel))`;
    const classOf = (v) => {
      for (let k = classes - 1; k >= 0; k--) if (v >= edges[k]) return k;
      return 0;
    };

    const header = `<div class="heat-row"><span class="heat-lab"></span>` +
      P.monthLabels.map((l) => `<span class="heat-head">${l[0]}</span>`).join("") + `</div>`;

    const body = heat.rows.map((row) => {
      const cells = row.cells.map((c) => {
        if (c.value === null) {
          return `<span class="heat-cell empty" title="${row.year}-${String(c.month).padStart(2, "0")} — no data (${Math.round(c.coverage * 100)}% of days)"></span>`;
        }
        const k = classOf(c.value);
        const ink = k >= classes - 2 ? "var(--panel)" : "var(--ink-2)";
        return `<span class="heat-cell" style="background:${stepColor(k)};color:${ink}"
          title="${row.year}-${String(c.month).padStart(2, "0")} — ${fmt(c.value, d)} ${m.unit} ${heat.agg}">${fmt(c.value, cellDp)}</span>`;
      }).join("");
      return `<div class="heat-row"><span class="heat-lab">${row.year}</span>${cells}</div>`;
    }).join("");

    const swatches = Array.from({ length: classes }, (_, k) =>
      `<span class="scale-step" style="background:${stepColor(k)}"></span>`).join("");

    host.innerHTML = `<div class="heat">${header}${body}</div>
      <div class="scale">
        <span class="scale-lab">${fmt(heat.min, d)}</span>
        <span class="scale-bar">${swatches}</span>
        <span class="scale-lab">${fmt(heat.max, d)} ${m.unit}</span>
        <span class="scale-lab">· monthly ${heat.agg} · outlined cell = month below 90% coverage</span>
      </div>`;
  }


  function findingsBlock(m) {
    if (!m.findings || !m.findings.length) return "";
    const items = m.findings
      .map((f) => `<li><b>${f.lead}</b> — ${f.text}</li>`).join("");
    return `<div class="findings"><h3>Key findings</h3><ul>${items}</ul></div>`;
  }

  function navBlock() {
    if (!P.nav || !P.nav.length) return "";
    const links = P.nav.map((n) =>
      `<a href="${n.href}"${n.current ? ' aria-current="page"' : ""}>${n.label}</a>`).join("");
    return `<nav class="nav">${links}<span class="spacer">${P.navNote || ""}</span></nav>`;
  }

  /* ------------- masthead ------------- */
  const st = P.station;
  document.getElementById("nav").outerHTML = navBlock();
  document.getElementById("eyebrow").textContent =
    `Station ${st.id} · ${st.name_zh} · ${P.window.start}–${P.window.end}`;
  document.getElementById("standfirst").textContent =
    `${P.totalObservations.toLocaleString("en-US")} daily observations across ` +
    `${P.days.toLocaleString("en-US")} days, shown three ways: the spread within each ` +
    `month, how often each value occurs, and every month of every year at once. ` +
    `Monthly means hide all of this.`;

  document.getElementById("readout").innerHTML = [
    ["Window", `${P.window.start}–${P.window.end}`],
    ["Days pooled", P.days.toLocaleString("en-US")],
    ["Observations", P.totalObservations.toLocaleString("en-US")],
    ["Measures", P.measures.length],
    ["Heat map to", P.heatmapEnd],
    ["Elevation", `${st.elevation_m} m`],
  ].map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join("");

  document.getElementById("caveat").innerHTML =
    `<strong>Why 2018 is the right floor.</strong> The soil probe and sunshine recorder ` +
    `both start that year, and every artificial break the record contains — 2002 in ` +
    `daily maximum and diurnal range, 2007 in wind, 2016 in rainfall intensity — falls ` +
    `before it. Pooling ${P.window.start}–${P.window.end} therefore needs no homogeneity ` +
    `adjustment. Box plots and histograms use complete years only, so each month carries ` +
    `the same number of seasons; the heat map keeps ${P.heatmapEnd} and marks its ` +
    `unfinished months.`;

  document.getElementById("foot").innerHTML =
    `Generated ${P.generated} from CWA CODiS station ${st.id} (${st.name_zh}). ` +
    `Boxes are Tukey: box spans the interquartile range, whiskers reach the furthest ` +
    `value within 1.5 IQR, dots are everything beyond. Up to 40 outliers are drawn per ` +
    `month; the tooltip reports the true count.`;

  /* ------------- panels ------------- */
  const container = document.getElementById("panels");
  container.style.display = "flex";
  container.style.flexDirection = "column";
  container.style.gap = "clamp(1.25rem, 1rem + 1vw, 2rem)";

  P.measures.forEach((m) => {
    const panel = document.createElement("section");
    panel.className = "panel";
    panel.style.setProperty("--hue", HUE[m.slot]);
    const o = m.overall, d = dec(m);

    const statCells = [
      ["n", o.n.toLocaleString("en-US")],
      ["min", fmt(o.min, d)],
      ["p5", fmt(o.p05, d)],
      ["q1", fmt(o.q1, d)],
      ["median", fmt(o.median, d)],
      ["q3", fmt(o.q3, d)],
      ["p95", fmt(o.p95, d)],
      ["max", fmt(o.max, d)],
      ["mean", fmt(o.mean, d)],
      ["sd", fmt(o.sd, d)],
    ].map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join("");

    const boxRows = m.monthly.map((b) => `<tr>
      <td>${b.label}</td><td>${b.n}</td><td>${fmt(b.min, d)}</td><td>${fmt(b.q1, d)}</td>
      <td>${fmt(b.median, d)}</td><td>${fmt(b.q3, d)}</td><td>${fmt(b.max, d)}</td>
      <td>${fmt(b.mean, d)}</td><td>${fmt(b.sd, d)}</td><td>${b.outlier_count}</td>
      ${m.key === "Precp" ? `<td>${fmt(b.dry_pct, 1)}%</td>` : ""}</tr>`).join("");

    const freqRows = m.frequency.bins.map((b) => `<tr>
      <td>${m.frequency.mode === "classes" ? b.label : `${fmt(b.lo, d)}–${fmt(b.hi, d)}`}</td>
      <td>${b.count.toLocaleString("en-US")}</td><td>${fmt(b.pct, 2)}%</td></tr>`).join("");

    panel.innerHTML = `
      <div class="panel-head">
        <div class="panel-id">
          <span class="zh">${m.zh}</span>
          <span class="en">${m.en}</span>
          <span class="key"><i class="swatch"></i>${m.key} · ${m.unit}</span>
        </div>
        <div class="hero">
          <div class="value">${fmt(o.median, d)}<span class="unit">${m.unit}</span></div>
          <div class="caption">median daily value · n = ${o.n.toLocaleString("en-US")}</div>
        </div>
      </div>

      <dl class="stats">${statCells}</dl>

      <div class="view">
        <h3 class="view-title">Box plot by month</h3>
        <p class="view-sub">daily values pooled across ${P.window.end - P.window.start + 1} years ·
          ${m.boxBasis} · box = IQR, whiskers = 1.5 IQR, dots = outliers${m.logScale ? " · log scale" : ""}</p>
        <div class="plot" data-chart="box"></div>
      </div>

      <div class="split">
        <div class="view">
          <h3 class="view-title">Frequency</h3>
          <p class="view-sub">${m.frequency.note}</p>
          <div class="plot" data-chart="hist"></div>
        </div>
        <div class="view">
          <h3 class="view-title">Heat map by month</h3>
          <p class="view-sub">monthly ${m.heatmap.agg}, ${P.window.start}–${P.heatmapEnd}</p>
          <div data-chart="heat"></div>
        </div>
      </div>

      ${findingsBlock(m)}

      <div class="table-wrap">
        <details>
          <summary>Table view — monthly statistics and frequency</summary>
          <div class="scroller">
            <table>
              <thead><tr><th>Month</th><th>n</th><th>Min</th><th>Q1</th><th>Median</th><th>Q3</th>
              <th>Max</th><th>Mean</th><th>SD</th><th>Outliers</th>${m.key === "Precp" ? "<th>Dry days</th>" : ""}</tr></thead>
              <tbody>${boxRows}</tbody>
            </table>
          </div>
          <div class="scroller" style="margin-top:0.75rem">
            <table>
              <thead><tr><th>${m.frequency.mode === "classes" ? "Class" : "Bin"} (${m.unit})</th><th>Days</th><th>Share</th></tr></thead>
              <tbody>${freqRows}</tbody>
            </table>
          </div>
        </details>
      </div>`;

    container.appendChild(panel);

    const boxHost = panel.querySelector('[data-chart="box"]');
    const histHost = panel.querySelector('[data-chart="hist"]');
    const heatHost = panel.querySelector('[data-chart="heat"]');

    const draw = () => { boxplot(boxHost, m); histogram(histHost, m); heatmap(heatHost, m); };
    draw();

    if (window.ResizeObserver) {
      let last = boxHost.clientWidth;
      new ResizeObserver(() => {
        if (Math.abs(boxHost.clientWidth - last) > 8) { last = boxHost.clientWidth; draw(); }
      }).observe(boxHost);
    }
    panel._redraw = draw;
  });

  const repaint = () => document.querySelectorAll(".panel").forEach((p) => p._redraw && p._redraw());
  if (window.matchMedia) {
    window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", repaint);
  }
  new MutationObserver(repaint).observe(document.documentElement, {
    attributes: true, attributeFilter: ["data-theme"],
  });
  // Print swaps the palette through @media print, and the charts read those
  // tokens at draw time, so they have to be redrawn before the page is paged.
  if (window.matchMedia) {
    window.matchMedia("print").addEventListener("change", repaint);
  }
  window.addEventListener("beforeprint", repaint);
})();
</script>
