  /* ---------------- chart plumbing ---------------- */
  /* A "nice" tick step (1, 2, 2.5, 5 x 10^k) for roughly `target` intervals. */
  function niceStep(range, target) {
    if (range <= 0) return 1;
    const raw = range / target;
    const mag = Math.pow(10, Math.floor(Math.log10(raw)));
    const n = raw / mag;
    return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * mag;
  }

  function scaleY(values, zeroBased) {
    const clean = values.filter((v) => v !== null && v !== undefined && !isNaN(v));
    if (!clean.length) return { lo: 0, hi: 1, ticks: [0, 1], decimals: 0 };

    const min = Math.min(...clean);

      show(x, y, html) {
        tip.innerHTML = html;
        tip.style.left = x + "px";
        tip.style.top = y + "px";
        tip.classList.add("on");
      },
      hide() { tip.classList.remove("on"); },
    };
  }

  /* ---------------- seasonal cycle ---------------- */
  function seasonal(plot, m) {
    const w = plot.clientWidth || 420;
    const h = Math.max(210, Math.min(260, w * 0.58));
    const box = { x0: 46, x1: w - 12, y0: 16, y1: h - 26 };
    const hue = css(`--m${m.slot}`);
    const bars = m.agg === "sum";

    const clim = m.climatology.filter((c) => c.mean !== null);
    const all = [];
    clim.forEach((c) => { all.push(c.hi, c.lo, c.mean); });
    const ys = scaleY(all, m.key !== "TxSoil0cm");

    plot.querySelectorAll("svg").forEach((n) => n.remove());
    const svg = el("svg", { viewBox: `0 0 ${w} ${h}`, width: w, height: h, role: "img" });
    svg.appendChild(el("title", {}, `${m.en} by month, ${P.window.start}-${P.window.end}`));

    const X = (i) => box.x0 + ((i + 0.5) / 12) * (box.x1 - box.x0);
    const Y = (v) => box.y1 - ((v - ys.lo) / (ys.hi - ys.lo)) * (box.y1 - box.y0);

    gridAndAxis(svg, box, ys, (t) => fmt(t, ys.decimals));

    if (bars) {
      const bw = Math.max(8, ((box.x1 - box.x0) / 12) - 6);
      clim.forEach((c) => {
        const i = c.month - 1;
        const x = X(i) - bw / 2;
        const y = Y(c.mean);
        svg.appendChild(el("rect", {
          x, y, width: bw, height: Math.max(1, box.y1 - y),
          rx: 4, ry: 4, fill: hue,
        }));
        // Year-to-year envelope as a whisker, not a second fill.
        svg.appendChild(el("line", {
          x1: X(i), x2: X(i), y1: Y(c.lo), y2: Y(c.hi),
          stroke: css("--ink-3"), "stroke-width": 1.5, "stroke-linecap": "round",
          opacity: 0.55,
        }));
      });
    } else {
      const area = clim.map((c) => `${X(c.month - 1)},${Y(c.hi)}`)
        .concat(clim.slice().reverse().map((c) => `${X(c.month - 1)},${Y(c.lo)}`));
      svg.appendChild(el("polygon", { points: area.join(" "), fill: hue, opacity: 0.14 }));
      svg.appendChild(el("polyline", {
        points: clim.map((c) => `${X(c.month - 1)},${Y(c.mean)}`).join(" "),
        fill: "none", stroke: hue, "stroke-width": 2,
        "stroke-linejoin": "round", "stroke-linecap": "round",
      }));
      clim.forEach((c) => {
        svg.appendChild(el("circle", {
          cx: X(c.month - 1), cy: Y(c.mean), r: 3.2,
          fill: hue, stroke: css("--surface-ring"), "stroke-width": 2,
        }));
      });
    }

    // Direct-label the peak month only.
    const peak = clim.reduce((a, b) => (b.mean > a.mean ? b : a), clim[0]);
    if (peak) {
      svg.appendChild(halo(el("text", {
        x: X(peak.month - 1), y: Y(peak.mean) - 13, "text-anchor": "middle",
        fill: css("--ink"), "font-size": 11, "font-weight": 650,
        "font-family": css("--mono"),
      }, `${fmt(peak.mean, dec(m))}`)));
    }

    m.climatology.forEach((c, i) => {
      if (i % (w < 380 ? 2 : 1) !== 0) return;
      svg.appendChild(el("text", {
        x: X(i), y: box.y1 + 15, "text-anchor": "middle",
        fill: css("--ink-3"), "font-size": 10, "font-family": css("--mono"),
      }, c.label[0]));
    });

    const tip = attachTip(plot);
    clim.forEach((c) => {
      const i = c.month - 1;
      const hit = el("rect", {
        x: X(i) - (box.x1 - box.x0) / 24, y: box.y0,
        width: (box.x1 - box.x0) / 12, height: box.y1 - box.y0,
        fill: "transparent",
      });
      hit.addEventListener("pointerenter", () => {
        tip.show(X(i), Y(c.mean), `<b>${c.label}</b> ${fmt(c.mean, dec(m))} ${m.unit}<br>` +
          `range ${fmt(c.lo, dec(m))}–${fmt(c.hi, dec(m))} · ${c.n} yr`);
      });
      hit.addEventListener("pointerleave", () => tip.hide());
      svg.appendChild(hit);
    });

    plot.insertBefore(svg, plot.firstChild);
  }

  /* ---------------- long record ---------------- */
  function record(plot, m) {
    const w = plot.clientWidth || 420;
    const h = Math.max(210, Math.min(260, w * 0.58));
    const hasBreaks = (m.breaks || []).length > 0;
    const box = { x0: 46, x1: w - 12, y0: hasBreaks ? 30 : 20, y1: h - 26 };
    const hue = css(`--m${m.slot}`);
    const bars = m.agg === "sum";

    const rows = m.annual.filter((r) => r.year <= P.window.end);
    const known = rows.filter((r) => r.value !== null);
    const ys = scaleY(known.map((r) => r.value), m.key !== "TxSoil0cm");

    const y0 = rows[0].year;
    const y1 = rows[rows.length - 1].year;
    const X = (yr) => box.x0 + ((yr - y0 + 0.5) / (y1 - y0 + 1)) * (box.x1 - box.x0);
    const Y = (v) => box.y1 - ((v - ys.lo) / (ys.hi - ys.lo)) * (box.y1 - box.y0);

    plot.querySelectorAll("svg").forEach((n) => n.remove());
    const svg = el("svg", { viewBox: `0 0 ${w} ${h}`, width: w, height: h, role: "img" });
    svg.appendChild(el("title", {}, `${m.en} by year, ${y0}-${y1}`));

    gridAndAxis(svg, box, ys, (t) => fmt(t, ys.decimals));

    // Breaks are drawn behind the data as a labelled rule.
    (m.breaks || []).forEach((b) => {
      const x = X(b.year) - (box.x1 - box.x0) / (y1 - y0 + 1) / 2;
      svg.appendChild(el("line", {
        x1: x, x2: x, y1: box.y0 - 4, y2: box.y1,
        stroke: css("--rule-strong"), "stroke-width": 1.5,
      }));
      svg.appendChild(el("text", {
        x: x + 3, y: box.y0 - 9, fill: css("--ink-3"),
        "font-size": 10, "font-family": css("--mono"),
      }, b.year));
    });

    if (bars) {
      const bw = Math.max(2, (box.x1 - box.x0) / (y1 - y0 + 1) - 2);
      known.forEach((r) => {
        const y = Y(r.value);
        svg.appendChild(el("rect", {
          x: X(r.year) - bw / 2, y, width: bw, height: Math.max(1, box.y1 - y),
          rx: Math.min(3, bw / 2), ry: Math.min(3, bw / 2), fill: hue,
        }));
      });
    } else {
      // One polyline per contiguous block, so gaps stay gaps.
      m.blocks.forEach(([a, b]) => {
        const seg = known.filter((r) => r.year >= a && r.year <= b);
        if (seg.length > 1) {
          svg.appendChild(el("polyline", {
            points: seg.map((r) => `${X(r.year)},${Y(r.value)}`).join(" "),
            fill: "none", stroke: hue, "stroke-width": 2,
            "stroke-linejoin": "round", "stroke-linecap": "round",
          }));
        }
      });
      known.forEach((r) => {
        svg.appendChild(el("circle", {
          cx: X(r.year), cy: Y(r.value), r: 3,
          fill: hue, stroke: css("--surface-ring"), "stroke-width": 1.6,
        }));
      });
    }

    // Direct-label the first and last observed year, unless they would collide.
    const first = known[0];
    const last = known[known.length - 1];
    const labels = first && last && X(last.year) - X(first.year) < 70 ? [last] : [first, last];
    labels.forEach((r) => {
      if (!r) return;
      const isFirst = r === first && labels.length > 1;
      svg.appendChild(halo(el("text", {
        x: X(r.year) + (isFirst ? 4 : -4), y: Y(r.value) - 12,
        "text-anchor": isFirst ? "start" : "end",
        fill: css("--ink"), "font-size": 10.5, "font-weight": 640,
        "font-family": css("--mono"),
      }, fmt(r.value, dec(m)))));
    });

    const span = y1 - y0;
    [y0, y0 + Math.round(span / 3), y0 + Math.round((2 * span) / 3), y1].forEach((yr) => {
      svg.appendChild(el("text", {
        x: X(yr), y: box.y1 + 15, "text-anchor": "middle",
        fill: css("--ink-3"), "font-size": 10, "font-family": css("--mono"),
      }, yr));
    });

    const tip = attachTip(plot);
    rows.forEach((r) => {
      const bw = (box.x1 - box.x0) / (y1 - y0 + 1);
      const hit = el("rect", {
        x: X(r.year) - bw / 2, y: box.y0, width: bw, height: box.y1 - box.y0,
        fill: "transparent",
      });
      hit.addEventListener("pointerenter", () => {
        const body = r.value === null
          ? `coverage ${(r.coverage * 100).toFixed(0)}% — below gate, not drawn`
          : `${fmt(r.value, dec(m))} ${m.unit}${m.agg === "sum" ? " total" : " mean"}`;
        tip.show(X(r.year), r.value === null ? box.y1 - 20 : Y(r.value), `<b>${r.year}</b> ${body}`);
      });
      hit.addEventListener("pointerleave", () => tip.hide());
      svg.appendChild(hit);
    });

    plot.insertBefore(svg, plot.firstChild);
  }

  /* ---------------- panels ---------------- */
  const container = document.getElementById("panels");
  container.style.display = "flex";
  container.style.flexDirection = "column";
  container.style.gap = "clamp(1.25rem, 1rem + 1vw, 2rem)";

  P.measures.forEach((m) => {
    const panel = document.createElement("section");
    panel.className = "panel";
    panel.style.setProperty("--hue", HUE[m.slot]);

    const trendText = (() => {
      const t = m.segment_trend;
      if (!t || t.slope_per_decade === null) return "record too short or too broken for a trend";
      const sig = t.p_value !== null && t.p_value < 0.05 ? "significant" : "not significant";
      const sign = t.slope_per_decade > 0 ? "+" : "";
      return `${sign}${fmt(t.slope_per_decade, 2)} ${m.unit}/decade over ${t.start}–${t.end} ` +
             `(${t.n} yr, ${sig})`;
    })();

    const gatePct = Math.round(m.gate * 100);
    const breakNote = (m.breaks || []).length
      ? " · rules mark station changes: " +
        m.breaks.map((b) => `${b.year} ${b.label}`).join(", ")
      : "";
    const heroLabel = m.agg === "sum" ? "typical year total" : "typical year mean";
    const heroValue = m.agg === "sum" ? fmt(m.window_mean, 0) : fmt(m.window_mean, dec(m));

    const covCells = m.annual.map((r) => {
      const cls = r.value !== null ? "full" : r.coverage > 0.05 ? "partial" : "";
      return `<span class="cov-cell ${cls}" title="${r.year} — ${(r.coverage * 100).toFixed(0)}% of days"></span>`;
    }).join("");

    const rowsHtml = m.annual.slice().reverse().map((r) => `
      <tr><td>${r.year}</td>
      <td class="${r.value === null ? "none" : ""}">${r.value === null ? "not drawn" : fmt(r.value, dec(m))}</td>
      <td>${(r.coverage * 100).toFixed(0)}%</td></tr>`).join("");

    const climRows = m.climatology.map((c) => `
      <tr><td>${c.label}</td>
      <td>${c.mean === null ? "–" : fmt(c.mean, dec(m))}</td>
      <td>${c.mean === null ? "–" : fmt(c.lo, dec(m))}</td>
      <td>${c.mean === null ? "–" : fmt(c.hi, dec(m))}</td></tr>`).join("");

    panel.innerHTML = `
      <div class="panel-head">
        <div class="panel-id">
          <span class="zh">${m.zh}</span>
          <span class="en">${m.en}</span>
          <span class="key"><i class="swatch"></i>${m.key} · ${m.unit}</span>
        </div>
        <div class="hero">
          <div class="value">${heroValue}<span class="unit">${m.unit}${m.agg === "sum" ? "/yr" : ""}</span></div>
          <div class="caption">${heroLabel} · ${P.window.start}–${P.window.end}</div>
        </div>
      </div>

      <p class="why">${m.why}</p>

      <div class="charts">
        <div class="chart-cell">
          <h3 class="chart-title">Seasonal cycle</h3>
          <p class="chart-sub">${m.agg === "sum" ? "mean monthly total" : "mean of daily values"} ·
            band shows year-to-year range · ${P.window.start}–${P.window.end}</p>
          <div class="plot" data-chart="seasonal"></div>
        </div>
        <div class="chart-cell">
          <h3 class="chart-title">The whole record</h3>
          <p class="chart-sub">${m.agg === "sum" ? "annual total" : "annual mean"} ·
            gaps are years below the ${gatePct}% coverage gate${breakNote}</p>
          <div class="plot" data-chart="record"></div>
        </div>
      </div>

      <div class="coverage">
        <h3 class="chart-title">Coverage, ${m.annual[0].year}–${m.annual[m.annual.length - 1].year}</h3>
        <p class="chart-sub">${m.record_years} usable years · trend: ${trendText}</p>
        <div class="cov-strip">${covCells}</div>
        <div class="cov-legend">
          <span><i class="cov-key" style="background:var(--hue)"></i>clears the ${gatePct}% gate</span>
          <span><i class="cov-key" style="background:color-mix(in oklab, var(--hue) 42%, var(--panel))"></i>partial year</span>
          <span><i class="cov-key" style="background:var(--rule)"></i>nothing recorded</span>
        </div>
      </div>

      ${findingsBlock(m)}

      <div class="table-wrap">
        <details>
          <summary>Table view — every value plotted above</summary>
          <div class="scroller">
            <table>
              <thead><tr><th>Month</th><th>Mean</th><th>Lowest yr</th><th>Highest yr</th></tr></thead>
              <tbody>${climRows}</tbody>
            </table>
          </div>
          <div class="scroller" style="margin-top:0.75rem">
            <table>
              <thead><tr><th>Year</th><th>${m.agg === "sum" ? "Total" : "Mean"} (${m.unit})</th><th>Coverage</th></tr></thead>
              <tbody>${rowsHtml}</tbody>
            </table>
          </div>
        </details>
      </div>`;

    container.appendChild(panel);

    const plots = panel.querySelectorAll(".plot");
    const draw = () => {
      seasonal(plots[0], m);
      record(plots[1], m);
    };
    draw();

    if (window.ResizeObserver) {
      let last = plots[0].clientWidth;
      new ResizeObserver(() => {
        if (Math.abs(plots[0].clientWidth - last) > 8) { last = plots[0].clientWidth; draw(); }
      }).observe(plots[0]);
    }
    panel._redraw = draw;
  });

  // Charts read CSS tokens at draw time, so a theme change needs a repaint.
  const repaint = () => document.querySelectorAll(".panel").forEach((p) => p._redraw && p._redraw());
  if (window.matchMedia) {
    window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", repaint);
  }
  new MutationObserver(repaint).observe(document.documentElement, {
    attributes: true, attributeFilter: ["data-theme"],
  });
  // Print swaps the palette through @media print, and the charts read those
  // tokens at draw time, so they have to be redrawn before the page is paged.
  if (window.matchMedia) {
    window.matchMedia("print").addEventListener("change", repaint);
  }
  window.addEventListener("beforeprint", repaint);
})();
</script>
