name: Deploy Pages

# OPTIONAL. Only needed if Pages is set to the "GitHub Actions" source.
#
# The simpler route needs no workflow at all: Settings -> Pages -> Deploy from
# a branch -> the default branch, folder /docs. docs/ is committed by the daily
# climate-sync workflow, so the site follows the data either way.
#
# This workflow is manual-dispatch only on purpose. Running it on every push
# would fail with "Resource not accessible by integration" until Pages has been
# switched to the Actions source, and a red X on every commit is worse than an
# opt-in button.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Only the default branch publishes, whatever it happens to be named.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # No `enablement: true`: the Actions token cannot create a Pages site,
      # so Pages must already be switched on in repository settings.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload docs/
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
